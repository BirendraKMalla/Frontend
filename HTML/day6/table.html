<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Table Structure</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
            text-align: center;
        }   
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th rowspan="2">S.N.</th>
                <th colspan="2">Name</th>
                <th colspan="2">Address</th>
            </tr>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>P. Address</th>
                <th>T. Address</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Hari</td>
                <td>Prasad</td>
                <td>Kathmandu</td>
                <td>Pokhara</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Sita</td>
                <td>Sharma</td>
                <td>Lalitpur</td>
                <td>Butwal</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Ram</td>
                <td>Thapa</td>
                <td>Bhaktapur</td>
                <td>Chitwan</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
